name: Desktop E2E

# The desktop suite drives the real Tauri binary through tauri-driver and
# WebView2. It needs an interactive Windows desktop session, which a hosted
# runner does not provide.
#
# Observed on actions/runner-images windows-latest (run 44893033642): the
# browser starts, then fails with
#
#   SessionNotCreatedError: session not created: DevToolsActivePort file doesn't exist
#
# so WebView2 cannot be driven there. This workflow is kept because it is the
# complete, reviewable description of how to run the suite somewhere that does
# have a session — a self-hosted Windows runner. Until one is registered it is
# manual only; it must not be added to ci.yml, where it can only be red.
#
# Run it locally instead: `npm run test:desktop` after `npm run tauri:build`.
on:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Swap for [self-hosted, windows] once such a runner exists; the steps
        # below are unchanged.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # msedgedriver must match the WebView2 runtime the runner already has, so
      # the version is read from the installed Edge rather than pinned here.
      - name: Install a matching msedgedriver
        shell: pwsh
        run: |
          $edge = (Get-Item "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" `
            -ErrorAction SilentlyContinue).VersionInfo.ProductVersion
          if (-not $edge) { throw "Edge not found; cannot match msedgedriver" }
          Write-Host "Edge $edge"

          $url = "https://msedgedriver.microsoft.com/$edge/edgedriver_win64.zip"
          $out = Join-Path $env:RUNNER_TEMP "edgedriver.zip"
          New-Item -ItemType Directory -Force -Path "tools\edgedriver" | Out-Null
          try {
            Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          } catch {
            throw "No msedgedriver published for Edge $edge ($url)"
          }
          Expand-Archive -Path $out -DestinationPath "tools\edgedriver" -Force
          & "tools\edgedriver\msedgedriver.exe" --version

      - name: Build the app
        run: npm run tauri:build

      # The suite launches the release binary itself; kill any stale instance
      # first, because the single-instance plugin makes a second launch exit 0.
      - name: Run the desktop suite
        shell: pwsh
        run: |
          Get-Process -Name mermaid-desk -ErrorAction SilentlyContinue | Stop-Process -Force
          npm run test:desktop

      - name: Keep the artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-artifacts
          path: |
            ${{ runner.temp }}/mermaiddesk-desktop-*
          retention-days: 7
          if-no-files-found: ignore
