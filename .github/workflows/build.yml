name: Build installers

# Manual runs produce downloadable artifacts; pushing a v* tag also creates a
# draft GitHub release with the platform bundles attached.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            artifact: mermaid-desk-windows
          - os: macos-latest
            bundles: app,dmg
            artifact: mermaid-desk-macos
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: mermaid-desk-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Fail in seconds, before a single bundle is built, when the tag and the
      # tree disagree. A tag that does not match the binaries makes the release
      # history a lie.
      - name: Check tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/set-version.mjs --check --tag "${{ github.ref_name }}"

      # The draft body is the changelog section for this version, so the
      # repository and the release page cannot drift apart. Missing section =
      # hard failure, not an empty release.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        run: node scripts/release-notes.mjs "${{ github.ref_name }}" --github-output

      - name: Build bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty on workflow_dispatch, so no release is created.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('MermaidDesk {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      - name: Upload bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14
          if-no-files-found: warn
