name: Build installers

# Manual runs produce downloadable artifacts; pushing a v* tag also creates a
# draft GitHub release with the platform bundles attached.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            artifact: mermaid-desk-windows
          - os: macos-latest
            bundles: app,dmg
            artifact: mermaid-desk-macos
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: mermaid-desk-linux
    runs-on: ${{ matrix.os }}
    # Only attaching assets to the draft needs write access.
    permissions:
      contents: write
    steps:
      # The release job holds a write-scoped token, so nothing later may inherit
      # it through the working tree.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Fail in seconds, before a single bundle is built, when the tag and the
      # tree disagree. A tag that does not match the binaries makes the release
      # history a lie. The tag arrives through the environment: interpolating
      # ${{ github.ref_name }} into the script would let a crafted tag name
      # inject shell commands.
      #
      # `shell: bash` is explicit because the matrix runs on three operating
      # systems and the default differs: bash on Linux/macOS, pwsh on Windows,
      # where `$TAG` is an unset local variable rather than the environment
      # variable and the guard silently receives an empty value.
      - name: Check tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/set-version.mjs --check --tag "$TAG"

      # The draft body is the changelog section for this version, so the
      # repository and the release page cannot drift apart. Missing section =
      # hard failure, not an empty release.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG" --github-output

      - name: Build bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty on workflow_dispatch, so no release is created.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('MermaidDesk {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      - name: Upload bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14
          if-no-files-found: warn

  # Runs once per tag, after every bundle has been attached. The hashes are
  # taken from the published assets themselves, so they describe exactly the
  # bytes users download. The block is idempotent: a re-run replaces it.
  checksums:
    name: Checksums
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    # Uploading SHA256SUMS.txt and rewriting the draft body need write access.
    permissions:
      contents: write
    steps:
      # Authenticates through GH_TOKEN below, so no stored git credential.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Hash the attached assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets
          rm -f release-assets/SHA256SUMS.txt
          cd release-assets
          sha256sum * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach the checksum file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/SHA256SUMS.txt --clobber

      - name: Append checksums to the draft notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          tag = os.environ["GITHUB_REF_NAME"]
          start, end = "<!-- checksums:start -->", "<!-- checksums:end -->"

          body = subprocess.run(
              ["gh", "release", "view", tag, "--json", "body", "--jq", ".body"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout.strip()

          # A re-run must not append the block twice.
          if start in body:
              body = body.split(start)[0].rstrip()

          sums = open("release-assets/SHA256SUMS.txt", encoding="utf-8").read().strip()
          block = f"{start}\n\n### Checksums\n\n```\n{sums}\n```\n\n{end}"
          with open("release-notes.md", "w", encoding="utf-8") as handle:
              handle.write(f"{body}\n\n{block}\n")

          subprocess.run(
              ["gh", "release", "edit", tag, "--notes-file", "release-notes.md"],
              check=True,
          )
          print("checksums appended")
          PY
